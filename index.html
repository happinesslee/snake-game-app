<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스네이크 게임 (Snake Game)</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <!-- 외부 스타일시트 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrapper">
    <!-- 헤더 / 스코어보드 -->
    <header class="game-header">
      <h1>🐍 스네이크 게임</h1>
      <div class="scoreboard">
        <div class="score-box">
          <span class="label">점수</span>
          <span id="score" class="val">0</span>
        </div>
        <div class="score-box highlight">
          <span class="label">최고 점수</span>
          <span id="highScore" class="val">0</span>
        </div>
      </div>
    </header>

    <!-- 게임 캔버스 및 오버레이 메인 영역 -->
    <main class="canvas-container">
      <!-- 400x400 게임 캔버스 -->
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <!-- 시작 화면 오버레이 -->
      <div id="startOverlay" class="overlay">
        <div class="overlay-content">
          <div class="icon">🎮</div>
          <h2>스네이크 게임</h2>
          <p>방향키로 뱀을 조종하여 먹이를 먹으세요!</p>
          <button id="startBtn" class="game-btn main-btn">게임 시작</button>
        </div>
      </div>

      <!-- 게임 오버 화면 오버레이 -->
      <div id="gameOverOverlay" class="overlay hidden">
        <div class="overlay-content">
          <div class="icon">💥</div>
          <h2 class="danger-text">GAME OVER</h2>
          <p>최종 점수: <strong id="finalScore">0</strong>점</p>
          <button id="restartBtn" class="game-btn restart-btn">다시 시작</button>
        </div>
      </div>
    </main>

    <!-- 방향키 가이드 -->
    <footer class="game-footer">
      <p>⌨️ 키보드 <strong>방향키(↑ ↓ ← →)</strong>로 이동할 수 있습니다.</p>
    </footer>
  </div>

  <!-- 메인 자바스크립트 -->
  <script src="main.js"></script>
</body>
</html>
